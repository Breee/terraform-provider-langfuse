# Disposable local acceptance-test stack. Do not use these credentials elsewhere.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "langfuse"]
      interval: 3s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  clickhouse:
    # Match the ClickHouse version in Langfuse's official Compose stack.
    image: clickhouse/clickhouse-server:26.3.62.3
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: langfuse
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "langfuse", "--password", "langfuse", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 120
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 3s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:1.0.4
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: langfuse-test
      RUSTFS_SECRET_KEY: langfuse-test-secret
      RUSTFS_CONSOLE_ENABLE: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready"]
      interval: 3s
      timeout: 5s
      retries: 10
    volumes:
      - rustfs_data:/data

  rustfs-init:
    image: amazon/aws-cli:2.39.6
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: langfuse-test
      AWS_SECRET_ACCESS_KEY: langfuse-test-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket langfuse ||
          aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket langfuse

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4.77.0
    depends_on: &langfuse-dependencies
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    environment: &langfuse-environment
      HOSTNAME: 0.0.0.0
      ADMIN_API_KEY: test_admin_key
      LANGFUSE_EE_LICENSE_KEY: ${LANGFUSE_EE_LICENSE_KEY:-}
      LANGFUSE_INIT_ORG_ID: test-org
      LANGFUSE_INIT_ORG_NAME: Test Organization
      LANGFUSE_INIT_USER_EMAIL: user@langfuse.com
      LANGFUSE_INIT_USER_NAME: Langfuse User
      LANGFUSE_INIT_USER_PASSWORD: defaultpassword
      DATABASE_URL: postgresql://langfuse:langfuse@postgres:5432/langfuse?sslmode=disable
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: langfuse
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NEXTAUTH_URL: http://localhost:3000
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse-test
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: langfuse-test-secret
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://rustfs:9000
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: langfuse-test
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: langfuse-test-secret
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://rustfs:9000
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      TELEMETRY_ENABLED: "false"
      LANGFUSE_CLICKHOUSE_PROJECT_DELETION_CONCURRENCY_DURATION_MS: "1000"
      NEXTAUTH_SECRET: devnextauthsecret
      SALT: devsalt
      ENCRYPTION_KEY: 15941deddb9502d002e114762aa6ad69ce839efb7dc47cd684feb884cad33ad8
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/public/health?failIfDatabaseUnavailable=true"]
      interval: 5s
      timeout: 5s
      retries: 120

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4.77.0
    depends_on:
      <<: *langfuse-dependencies
      langfuse-web:
        condition: service_healthy
    environment: *langfuse-environment
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3030/api/health"]
      interval: 5s
      timeout: 5s
      retries: 120

volumes:
  postgres_data:
  clickhouse_data:
  rustfs_data:
